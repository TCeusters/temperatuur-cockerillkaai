name: Temperatuurgrafiek bijwerken

on:
  workflow_dispatch: {}         # gestart door cron-job.org (elk uur) of handmatig via "Run workflow"

# Recht om naar de gh-pages branch te pushen
permissions:
  contents: write

concurrency:
  group: publiceren
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repo ophalen
        uses: actions/checkout@v4

      - name: Grafiek + CSV genereren
        env:
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
          HOURLY_DAYS: "42"
          LAT: "51.212"
          LON: "4.399"
        run: python3 scripts/build.py

      # Netatmo geeft soms een NIEUW refresh-token terug; dat bewaren we als secret.
      # Draait ook als de stap hierboven faalde, zolang er een nieuw token bewaard werd.
      - name: Nieuw refresh-token bewaren
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f new_refresh_token.txt ]; then
            gh secret set NETATMO_REFRESH_TOKEN \
              --body "$(cat new_refresh_token.txt)" \
              --repo "$GITHUB_REPOSITORY"
            echo "Nieuw Netatmo refresh-token opgeslagen als secret."
            rm -f new_refresh_token.txt
          else
            echo "Geen nieuw refresh-token; niets te doen."
          fi

      # Publiceer de gebouwde bestanden naar de gh-pages branch (force = altijd 1 commit,
      # dus geen opeenstapelende historie / geen repo-bloat).
      - name: Publiceren naar gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site bijgewerkt: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
